<line x1="860" y1="762" x2="890" y2="762" stroke="#e67e22" stroke-width="3"/>
<text x="900" y="767" font-size="12.5" fill="#222"><tspan font-weight="700">Wi-Fi 5 GHz: </tspan>pupila, mirada y parpadeos (≈ 10 KB/s) + foto del texto a 2 fps (≈ 200 KB/s) → iPad o computador</text>
<line x1="860" y1="782" x2="890" y2="782" stroke="#34495e" stroke-width="3"/>
<text x="900" y="787" font-size="12.5" fill="#222"><tspan font-weight="700">USB-C: </tspan>alternativa por cable al computador (red Ethernet sobre USB); más estable en el laboratorio</text>
<rect x="40" y="830" width="1920" height="70" rx="16" fill="#1F3864"/>
<text x="70" y="874" font-size="22" font-weight="700" fill="#fff">TOTAL PROTOTIPO ≈ US$ 240–350  (revisado; antes estimé 200–230)</text>
<text x="1940" y="862" font-size="14" fill="#dfe8f5" text-anchor="end">+ envío e IVA (19 %) si se importa a Chile → ≈ US$ 300–450</text>
<text x="1940" y="884" font-size="13" fill="#dfe8f5" text-anchor="end">* = estimado, sin precio verificado · resto: precios de tiendas, nov-2026 · iPad: + US$ 99/año solo si se publica la app</text>
<rect x="40" y="920" width="1920" height="320" rx="16" fill="#fff8e6" stroke="#e5c66b"/>
<text x="60" y="950" font-size="16" font-weight="700" fill="#7d5a00">Compromisos y advertencias del diseño low cost</text>
<text x="60" y="980" font-size="13" fill="#333"><tspan font-weight="700">Cambio de cámara ocular: </tspan>el OV7251 solo llega a 30 fps con el driver oficial. El OV9281 cuesta parecido y en el Pi 5 da ~310 fps a 640×400 con el driver estándar: cumple los 250 Hz.</text>
<text x="60" y="1003" font-size="13" fill="#333"><tspan font-weight="700">Riesgo OV9281 + Pi 5: </tspan>hay reportes de módulos que el Pi 5 no detecta. Compre primero una unidad de prueba y verifíquela; procesar 2 × 300 fps exige recortar la imagen al ojo (ROI).</text>
<text x="60" y="1026" font-size="13" fill="#333"><tspan font-weight="700">Seguridad ocular IR: </tspan>la irradiancia sobre el ojo debe medirse y quedar bajo los límites de IEC 62471. Usar LEDs de baja potencia, corriente limitada y pulsados.</text>
<text x="60" y="1049" font-size="13" fill="#333"><tspan font-weight="700">Por qué el procesamiento ocular va en el bolsillo: </tspan>el video ocular crudo (≈ 1,2 Gbit/s a 300 fps) no se puede enviar de forma fiable por Wi-Fi ni a un iPad. El Pi detecta la pupila y los parpadeos y envía solo datos.</text>
<text x="60" y="1072" font-size="13" fill="#333"><tspan font-weight="700">Reparto del trabajo: </tspan>el Pi 5 (1 GB) solo hace el tiempo real ocular. El OCR, el modelo de lenguaje, P1–P4 y el informe corren en el iPad o el computador, que tienen más potencia.</text>
<text x="60" y="1095" font-size="13" fill="#333"><tspan font-weight="700">Sincronización: </tspan>cada dato ocular y cada foto de escena llevan marca de tiempo del Pi. Así la mirada se asigna a la palabra correcta aunque el Wi-Fi tenga retardo.</text>
<text x="60" y="1118" font-size="13" fill="#333"><tspan font-weight="700">Alternativa solo computador: </tspan>cámaras oculares USB conectadas directo al PC con un hub, sin Pi. Requiere cámaras USB de alta tasa (más caras) y no sirve para iPad.</text>
<text x="60" y="1141" font-size="13" fill="#333"><tspan font-weight="700">Pi 5 de 1 GB y no de 2 GB: </tspan>el de 2 GB subió a US$ 77,50 (oct-2026). Con el análisis pesado en el iPad o PC, 1 GB alcanza. La fuente de 5 V/3 A limita el USB del Pi a 600 mA: suficiente para la cámara de escena.</text>
<text x="60" y="1164" font-size="13" fill="#333"><tspan font-weight="700">LEDs y filtro: </tspan>el SFH 4050 emite a 860 nm; confirme que cae dentro de la banda del filtro de 850 nm o use LEDs de 850 nm.</text>
<text x="60" y="1187" font-size="13" fill="#333"><tspan font-weight="700">Precios: </tspan>referenciales, de tiendas en USD; varían según la tienda y el momento. Los de Raspberry Pi subieron varias veces en 2025–2026 por el costo de la RAM.</text>
</svg>