<text x="900" y="747" font-size="12.5" fill="#222"><tspan font-weight="700">5 V USB-C PD: </tspan>power bank → Pi 5 → montura</text>
<line x1="860" y1="762" x2="890" y2="762" stroke="#e67e22" stroke-width="3"/>
<text x="900" y="767" font-size="12.5" fill="#222"><tspan font-weight="700">Wi-Fi 5 GHz: </tspan>pupila, mirada y parpadeos (≈ 10 KB/s) + foto del texto a 2 fps (≈ 200 KB/s) → iPad o computador</text>
<line x1="860" y1="782" x2="890" y2="782" stroke="#34495e" stroke-width="3"/>
<text x="900" y="787" font-size="12.5" fill="#222"><tspan font-weight="700">USB-C: </tspan>alternativa por cable al computador (red Ethernet sobre USB); más estable en el laboratorio</text>
<rect x="40" y="830" width="1920" height="70" rx="16" fill="#1F3864"/>
<text x="70" y="874" font-size="22" font-weight="700" fill="#fff">TOTAL COSTO MÍNIMO ≈ US$ 150–200  (versión estándar: 240–350)</text>
<text x="1940" y="862" font-size="14" fill="#dfe8f5" text-anchor="end">+ envío e IVA (19 %) en Chile → ≈ US$ 190–260</text>
<text x="1940" y="884" font-size="13" fill="#dfe8f5" text-anchor="end">Precios de ofertas y vendedores genéricos: cambian a diario · + PCB para los LEDs (no incluida) · iPad: + US$ 99/año si se publica</text>
<rect x="40" y="920" width="1920" height="320" rx="16" fill="#fff8e6" stroke="#e5c66b"/>
<text x="60" y="950" font-size="16" font-weight="700" fill="#7d5a00">Compromisos y advertencias del diseño low cost</text>
<text x="60" y="980" font-size="13" fill="#333"><tspan font-weight="700">Qué se sacrifica: </tspan>vendedores genéricos sin soporte técnico, control de calidad variable y plazos de envío de 2–6 semanas. Compre 1–2 unidades extra de lo barato (sensores, LEDs, filtros).</text>
<text x="60" y="1003" font-size="13" fill="#333"><tspan font-weight="700">Cámaras oculares: </tspan>el OV9281 genérico podría no traer driver para el Pi 5. Pruebe una unidad antes de comprar la segunda. Verifique que venga sin filtro IR o con soporte para 850 nm.</text>
<text x="60" y="1026" font-size="13" fill="#333"><tspan font-weight="700">LEDs de LCSC: </tspan>son SMD y requieren una placa (PCB) donde soldarlos. Un PCB rígido pequeño en JLCPCB cuesta pocos dólares más envío; un anillo flexible, bastante más.</text>
<text x="60" y="1049" font-size="13" fill="#333"><tspan font-weight="700">Filtros de US$ 1: </tspan>verifique el diámetro exacto y el ancho de banda (idealmente ≤ 50 nm). Los más baratos suelen ser de 8 mm, no de 10 mm.</text>
<text x="60" y="1072" font-size="13" fill="#333"><tspan font-weight="700">Raspberry Pi en Chile: </tspan>las tiendas locales venden el Pi 5 de 2 GB entre CLP 95.000 y 130.000. Comprar el de 1 GB a US$ 45 en un distribuidor oficial extranjero sale más barato, aun con envío.</text>
<text x="60" y="1095" font-size="13" fill="#333"><tspan font-weight="700">Power bank barato: </tspan>confirme que entregue 5 V/3 A estables; el Pi 5 se reinicia si el voltaje cae bajo carga.</text>
<text x="60" y="1118" font-size="13" fill="#333"><tspan font-weight="700">App en iPad: </tspan>para el prototipo puede instalarse gratis en su propio iPad con una cuenta Apple sin pago (la app expira cada 7 días). Los US$ 99/año solo son necesarios para distribuirla.</text>
<text x="60" y="1141" font-size="13" fill="#333"><tspan font-weight="700">Seguridad ocular IR: </tspan>con LEDs baratos es aún más importante medir la irradiancia sobre el ojo y quedar bajo los límites de IEC 62471.</text>
<text x="60" y="1164" font-size="13" fill="#333"><tspan font-weight="700">Precios: </tspan>los más bajos encontrados en AliExpress, LCSC, Newegg y distribuidores oficiales; muchos son ofertas para nuevos compradores y no incluyen envío.</text>
</svg>