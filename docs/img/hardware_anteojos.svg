<text x="157.0" y="225" font-size="12" fill="#555" text-anchor="middle">visible a terceros al grabar</text>
<text x="217.0" y="345.0" font-size="12" fill="#6b7f99" text-anchor="middle">lente graduable</text>
<text x="217.0" y="361.0" font-size="12" fill="#6b7f99" text-anchor="middle">o neutra</text>
<text x="497.0" y="345.0" font-size="12" fill="#6b7f99" text-anchor="middle">filtro IR exterior</text>
<text x="497.0" y="361.0" font-size="12" fill="#6b7f99" text-anchor="middle">(reduce ruido solar)</text>
<text x="357" y="470" font-size="12.5" fill="#555" text-anchor="middle">El campo de la cámara de escena cubre la zona de lectura (~40 cm, 60° vertical hacia abajo).</text>
