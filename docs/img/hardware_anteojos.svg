<text x="50" y="835" font-size="16" font-weight="700" fill="#2F5496">Especificaciones objetivo</text>
<text x="50" y="865" font-size="13.5" fill="#1F3864"><tspan font-weight="700">Muestreo ocular: </tspan>≥ 250 Hz binocular</text>
<text x="380" y="865" font-size="13.5" fill="#1F3864"><tspan font-weight="700">Precisión: </tspan>≤ 0,5° (nivel palabra)</text>
<text x="710" y="865" font-size="13.5" fill="#1F3864"><tspan font-weight="700">Ruido pupilar: </tspan>≤ 0,02 mm RMS</text>
<text x="1040" y="865" font-size="13.5" fill="#1F3864"><tspan font-weight="700">Peso: </tspan>≤ 60 g</text>
<text x="50" y="903" font-size="13.5" fill="#1F3864"><tspan font-weight="700">Autonomía: </tspan>≥ 4 h de lectura</text>
<text x="380" y="903" font-size="13.5" fill="#1F3864"><tspan font-weight="700">Privacidad: </tspan>procesamiento local</text>
<text x="710" y="903" font-size="13.5" fill="#1F3864"><tspan font-weight="700">Parámetros: </tspan>P1 fijación · P2 regresiones · P3 pupila · P4 parpadeo</text>
