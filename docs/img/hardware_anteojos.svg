<text x="40" y="50" font-size="26" font-weight="700" fill="#1F3864">Anteojos para medición de carga cognitiva en lectura — concepto de hardware</text>
<text x="40" y="76" font-size="14" fill="#555">Dibujo conceptual, sin escala. Vistas: frontal (A), interior hacia el usuario (B) y lateral de la patilla derecha (C).</text>
